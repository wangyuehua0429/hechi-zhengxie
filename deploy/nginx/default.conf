# 站点 vhost（本地开发版）：静态文件直出，/api/v1/* 交给 PHP-FPM
server {
    listen 80;
    server_name localhost;
    charset utf-8;
    root /var/www/html;
    index index.php;

    # 接口
    location /api/ {
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # 静态化产物（publish 生成后由 Nginx 直出）
    location /channel/ {
        root /var/www/publish;
        try_files $uri $uri/index.html =404;
    }

    location /article/ {
        root /var/www/publish;
        try_files $uri =404;
    }

    # 旧地址 301：映射表落在数据库，正式环境由发布器生成 rewrite 规则，
    # 这里先留出统一入口，避免各页面各自处理。
    location /news-view- {
        return 301 /article/$1;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|webp|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
