# 站点 vhost：站点页面（frontend/home）为根，/api 与 /admin 交给同一个 PHP 入口，
# 同源部署，前端不需要跨域配置。
#
# 说明：本文件尚未在真实环境验证（开发机未装 Docker）。首次部署时先看 deploy/README.md。

server {
    listen 80;
    server_name localhost;
    charset utf-8;
    root /var/www/site;
    index index.html;

    # 内容接口与后台：统一走 backend/public/index.php
    location /api/ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
    }

    location /admin {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
    }

    # 政协委员提案门户（/member/*）：与后台同一入口，会话相互独立
    location /member {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
    }

    # 后台样式与上传文件（publish 生成物里的上传目录）
    location /assets/ {
        alias /var/www/backend/public/assets/;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /uploads/ {
        alias /var/www/backend/public/uploads/;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 静态化产物：全文静态页与 sitemap（发布器输出目录）
    location /article/ {
        root /var/www/publish;
        try_files $uri =404;

        # 纵深防御：与后台同源思路，静态页也加安全头。
        # 脚本只放同源（正文里的 <script> 已被服务端白名单剥掉，这里再兜一层）；
        # img／media 放行 http、https，是因为历史正文里还有指向老站域名的图片与视频，
        # 收紧成 'self' 会让这些老稿子破图。
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self' data: http: https:; media-src 'self' http: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'" always;
    }

    # 栏目静态页：/channel/<目录名>/（目录名规则见 backend/src/Publish/StaticPaths.php，
    # slug 重复的一级栏目会补栏目号，保证 43 个栏目 43 个路径）
    location /channel/ {
        root /var/www/publish;
        index index.html;
        try_files $uri $uri/index.html =404;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /sitemap.xml {
        root /var/www/publish;
    }

    # 旧地址 301：映射明细在 sys_url_redirect 表里，由 PHP 入口精确判定（命中率记在 hits 字段）；
    # 本文件由 `php backend/bin/redirects.php --out=/var/www/publish` 生成，改动见
    # docs/旧地址301映射说明.md。此处原先手写过一条按前缀跳转的规则，已删除——
    # 旧站根目录下并没有 news-view-<id>.html（静态页都在 html/ 子目录），
    # 且前缀匹配（^~）里取不到 $1，那条规则会把所有命中路径都跳到 /article/。
    include /var/www/publish/redirects/nginx-301.conf;

    location ~* \.(?:css|js|jpg|jpeg|png|gif|webp|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
