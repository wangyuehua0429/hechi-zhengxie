# 站点 vhost：站点页面（frontend/home）为根，/api 与 /admin 交给同一个 PHP 入口，
# 同源部署，前端不需要跨域配置。
#
# 前缀 location 一律带 `^~`：本文件末尾有一条按扩展名的正则 location（css/js/图片等，
# 给静态资源加缓存头）。nginx 的匹配顺序是「先记最长前缀，再按顺序跑正则，正则命中即用」，
# 只有 `^~` 前缀才会跳过后面的正则。不加 `^~` 的话，/uploads/x.jpg、/assets/admin.css
# 这类请求会被那条正则截走，alias 与 fastcgi 都不生效，直接按站点根找文件 → 404。
# 本文件尚未在真实环境验证（开发机未装 Docker），首次部署时先看 deploy/README.md。

server {
    listen 80;
    server_name localhost;
    charset utf-8;
    root /var/www/site;
    index index.html;

    # 内容接口与后台：统一走 backend/public/index.php
    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
    }

    location ^~ /admin {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
    }

    # 政协委员提案门户（/member/*）：与后台同一入口，会话相互独立
    location ^~ /member {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
    }

    # 后台样式与上传文件（publish 生成物里的上传目录）
    location ^~ /assets/ {
        alias /var/www/backend/public/assets/;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /uploads/ {
        alias /var/www/backend/public/uploads/;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 旧站上传目录：/uploadfiles/<年月>/<文件> → backend/public/uploads/legacy/uploadfiles/
    # 历史正文与旧站外链仍是这个形状的地址（旧站 vhost 的站点根是 /www/wwwroot/gxhczx.gov.cn，
    # 图片在该根的 uploadfiles/ 下）。域名切到新站后，只有这一条能接住这些请求；
    # 图片按 docs/旧站图片线索与拷贝清单.md 拷进对应目录即可生效，不必重新发布。
    # 与 backend/public/router.php 里同名分支保持同一口径。
    location ^~ /uploadfiles/ {
        alias /var/www/backend/public/uploads/legacy/uploadfiles/;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 阶段 A 的静态快照（frontend/home/data）落在站点根下，默认可被直接下载——里面有归档稿
    # 的正文全文，不能对外。生产一律拦掉：站点的内容出口只有 /api/v1 与静态页，
    # 页面的 ?api=0 快照模式只用于本地开发（2026-09-17 独立评审 P1）。
    location ^~ /data/ {
        deny all;
        return 404;
    }

    # 静态化产物：全文静态页与 sitemap（发布器输出目录）
    location ^~ /article/ {
        root /var/www/publish;
        try_files $uri =404;

        # 纵深防御：与后台同源思路，静态页也加安全头。这条 CSP 与下面 /channel/ 的那条必须一致
        # （tests/redirect-check.mjs 会比对两处文本，改一处忘了另一处会红）。
        # 脚本只放同源：正文里的 <script> 已被服务端白名单剥掉，静态页自身的脚本也全部走
        # /js/*.js 外链——没有 unsafe-inline 也没有逐页哈希，任何内联 <script> 都会被浏览器
        # 整段拒绝执行（2026-09-17 发现 page.php 的交互脚本曾因这条整段失效，已外移）。
        # img／media 放行 http、https，是因为历史正文里还有指向老站域名的图片与视频，
        # 收紧成 'self' 会让这些老稿子破图。
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self' data: http: https:; media-src 'self' http: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'" always;
    }

    # 栏目静态页：/channel/<目录名>/（目录名规则见 backend/src/Publish/StaticPaths.php，
    # slug 重复的一级栏目会补栏目号，保证 43 个栏目 43 个路径）
    location ^~ /channel/ {
        root /var/www/publish;
        index index.html;
        try_files $uri $uri/index.html =404;
        # 与 /article/ 同一口径：栏目页也是发布器渲染的同构页面，脚本同样是 /js/*.js 外链。
        # 这条 CSP 与上面 /article/ 的那条必须逐字一致。
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self' data: http: https:; media-src 'self' http: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'" always;
    }

    location = /sitemap.xml {
        root /var/www/publish;
    }

    # 旧地址 301：映射明细在 sys_url_redirect 表里，由 PHP 入口精确判定（命中率记在 hits 字段）；
    # 本文件由 `php backend/bin/redirects.php --out=/var/www/publish` 生成，改动见
    # docs/旧地址301映射说明.md。此处原先手写过一条按前缀跳转的规则，已删除——
    # 旧站根目录下并没有 news-view-<id>.html（静态页都在 html/ 子目录），
    # 且前缀匹配（^~）里取不到 $1，那条规则会把所有命中路径都跳到 /article/。
    include /var/www/publish/redirects/nginx-301.conf;

    # 静态资源缓存头。注意这条是正则 location，会盖过所有没有 `^~` 的前缀 location
    # （原因见文件头），所以上面每个前缀 location 都写了 `^~`；新增前缀 location 时照做。
    location ~* \.(?:css|js|jpg|jpeg|png|gif|webp|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
