# 生产同构的本地开发环境：Nginx + PHP-FPM 8 + MySQL 8 + Redis
# 用法见 deploy/README.md。本机若无 Docker，用 backend/README.md 的 SQLite 方式即可跑通接口与发布。
services:
  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # 站点页面（首页/栏目页/详情页 + js/css/data/images）作为站点根
      - ./frontend/home:/var/www/site:ro
      # 后台样式与上传文件
      - ./backend/public:/var/www/backend/public:ro
      # 静态化产物由 publish 命令写入，Nginx 直出
      - ./backend/storage/publish:/var/www/publish:ro
    depends_on:
      - php

  php:
    build:
      context: ./deploy/php
    working_dir: /var/www/backend
    environment:
      APP_ENV: production
      APP_DEBUG: "0"
      DB_DRIVER: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: hechi_zx
      DB_USERNAME: hechi_zx
      DB_PASSWORD: hechi_zx_dev
    volumes:
      # 内容以库为唯一来源：快照（frontend/home/data）是阶段 A 的演示与测试夹具，
      # 不挂进运行环境，也不在生产跑 seed（2026-09-17 口径）。
      - ./backend:/var/www/backend
    depends_on:
      - db

  db:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root_dev
      MYSQL_DATABASE: hechi_zx
      MYSQL_USER: hechi_zx
      MYSQL_PASSWORD: hechi_zx_dev
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      # 首次启动自动建表（与 php backend/bin/migrate.php 等价）
      - ./database/migrations/mysql:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

volumes:
  db_data:
